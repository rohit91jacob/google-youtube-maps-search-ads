name: refresh

# Scheduled data refresh on the emulated stack (filesystem lake, DuckDB warehouse, local Pub/Sub):
#   * every 3 hours: poll Google Trends (the feed only lists the ~10 searches trending right now, so
#     churn and longevity need frequent polls) and drain the event stream into bronze;
#   * daily at 06:30 UTC: every source, load + DQ, dbt build + DQ, and publish the results site to
#     GitHub Pages. The political-ads bundle is regenerated daily, Netflix Top 10 weekly (Tuesdays),
#     OSM counts are refreshed weekly (osm_max_age_days) and YouTube feeds change several times a day.
# All sources are credential-free. The optional YouTube Data API runs only if the YOUTUBE_API_KEY
# secret exists. The lake is carried between runs in the Actions cache.

on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      force_osm:
        description: "Re-count OSM even if counted within the last week"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  UV_FROZEN: "1"
  PYTHON_VERSION: "3.12"
  PYTHONIOENCODING: utf-8
  GECO_DATA_DIR: /home/runner/geco-data
  GECO_LOG_FORMAT: text
  FULL_RUN: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '30 6 * * *' }}

jobs:
  build:
    name: refresh lake (+ build site on the daily run)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      full: ${{ env.FULL_RUN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Restore the lake from the previous run
        id: lake
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GECO_DATA_DIR }}/lake
          key: geco-lake-${{ github.run_id }}
          restore-keys: geco-lake-
      - name: Report lake state
        run: |
          if [ -n "${{ steps.lake.outputs.cache-matched-key }}" ]; then
            echo "restored from: ${{ steps.lake.outputs.cache-matched-key }}"; du -sh "$GECO_DATA_DIR/lake"
          else
            echo "restored from: nothing (first run: Trends history starts now)"
          fi
      - run: uv sync --all-extras
      - name: Poll Google Trends + drain the event stream
        if: env.FULL_RUN != 'true'
        run: uv run geco poll-trends
      - name: Full pipeline (exit 3 = data-quality gate, 4 = dbt)
        if: env.FULL_RUN == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: uv run geco run --site site ${{ inputs.force_osm && '--force-osm' || '' }}
      - name: Bound bronze history of snapshot sources
        run: uv run geco prune --keep 3
      - name: Save the lake for the next run
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GECO_DATA_DIR }}/lake
          key: geco-lake-${{ github.run_id }}
      - name: Summary
        if: env.FULL_RUN == 'true'
        run: |
          echo "### Results site" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat site/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: env.FULL_RUN == 'true'
        with:
          path: site

  deploy:
    name: publish to GitHub Pages
    needs: build
    if: needs.build.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  alert:
    name: open or update a failure issue
    needs: [build, deploy]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Scheduled refresh is failing
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or comment on the tracking issue
        run: |
          body="The scheduled \`refresh\` run failed: $RUN_URL

          See docs/runbook.md#scheduled-refresh-github-actions. Close this issue once a run is green."
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
