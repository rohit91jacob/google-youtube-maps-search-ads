version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    # dbt-core and its adapters move together; bump them deliberately.
    ignore:
      - dependency-name: dbt-core
      - dependency-name: dbt-duckdb
      - dependency-name: dbt-bigquery
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Python 3.13+ base images: the pinned libraries are not on 3.13+ yet; take 3.12 patches only
      - dependency-name: python
        versions: [">=3.13"]
