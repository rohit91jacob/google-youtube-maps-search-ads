version: 2
models:
  - name: mart_netflix_title_longevity
    description: >
      One row per title per global list: weeks in the Top 10, first/last week, best rank, weeks at
      #1, total hours and views while charting, and a reconciliation against Netflix's own
      cumulative_weeks_in_top_10.
    data_tests:
      - unique_combination: {arguments: {columns: [category, title]}}
    columns:
      - name: weeks_in_top10
        data_tests: [not_null, {value_between: {arguments: {min_value: 1, max_value: 1000}}}]
      - name: best_rank
        data_tests: [{value_between: {arguments: {min_value: 1, max_value: 10}}}]
  - name: mart_netflix_language_mix_weekly
    description: >
      Hours and views of the weekly global Top 10 lists split by content type (film/tv) and
      language (english/non_english). Covers only titles that made a Top 10 list.
    data_tests:
      - unique_combination: {arguments: {columns: [week_end_date, content_type, language]}}
    columns:
      - name: share_of_hours
        data_tests: [not_null, {value_between: {arguments: {min_value: 0, max_value: 1}}}]
  - name: mart_netflix_country_reach
    description: Countries whose weekly Top 10 included each title, for the most recent weeks.
    data_tests:
      - unique_combination: {arguments: {columns: [week_end_date, content_type, title]}}
    columns:
      - name: countries_in_top10
        data_tests: [{value_between: {arguments: {min_value: 1, max_value: 200}}}]
