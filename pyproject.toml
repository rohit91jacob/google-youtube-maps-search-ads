[project]
name = "google-youtube-maps-search-ads"
version = "0.1.0"
description = "Google ecosystem analytics (Search trends, political Ads, YouTube vs Netflix streaming, Maps POIs) on an emulated GCP stack: GCS bronze -> BigQuery (DuckDB locally) with dbt."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
authors = [{ name = "rohit91jacob" }]
dependencies = [
    "defusedxml>=0.7.1,<0.8",
    "duckdb>=1.5,<2",
    "fastexcel>=0.14,<1",
    "fsspec>=2025.3",
    "jinja2>=3.1,<4",
    "polars>=1.30,<3",
    "pyarrow>=18",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "requests>=2.32,<3",
    "typer>=0.15",
    "urllib3>=2.2,<3",
]

[project.optional-dependencies]
# Real GCP clients. Only needed against real GCP or the official emulators (CI integration job).
gcp = [
    "gcsfs>=2025.3",
    "google-cloud-pubsub>=2.27,<3",
]

[project.scripts]
geco = "geco.cli:app"

[dependency-groups]
dbt = [
    "dbt-core>=1.10,<1.13",
    "dbt-bigquery>=1.10,<1.13",
    "dbt-duckdb>=1.10,<1.12",
]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pyyaml>=6.0",
    "responses>=0.25",
    "ruff>=0.16,<0.17",
    "sqlfluff>=3.3,<5",
    "xlsxwriter>=3.2",
]

[tool.uv]
default-groups = ["dbt", "dev"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geco"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "PL"]
ignore = [
    "PLR0913", # CLI entrypoints legitimately take many options
    "PLR2004", # magic values are fine in data-validation thresholds
    "PLC0415", # optional GCP SDKs are imported lazily so local installs stay light
    "E501",    # ruff format owns line length; long SQL strings in checks stay readable
]

# Typographic characters that the results site and docs use on purpose.
allowed-confusables = ["–", "×", " "]

[tool.ruff.lint.pylint]
max-returns = 10
max-branches = 20
max-statements = 70

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PT018"]
"scripts/**" = ["S311"] # seeded random for synthetic fixtures, not crypto
# SQL in these modules is assembled from in-code constants and table names, never from user input.
"src/geco/{quality/checks,warehouse,report}.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not live'"
markers = [
    "e2e: full pipeline on fixtures including dbt build (slower)",
    "integration: needs the GCS / Pub/Sub emulators (CI job only)",
    "live: downloads real data from the public sources",
]

[tool.coverage.run]
source = ["geco"]
branch = true
